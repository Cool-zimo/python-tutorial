<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 从零到进阶 · 可运行 · 可记笔记</title>
<meta name="description" content="中文 Python 教程：浏览器内真实运行代码，笔记与学习进度跨设备同步">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <button class="icon-btn" id="btn-menu" aria-label="目录">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand" id="btn-home" title="回到书单">
    <span class="logo">🐍</span>
    <span class="title" id="book-title">Python 从零到进阶</span>
  </div>
  <div class="topbar-right">
    <div class="sync-pill" id="sync-pill" title="同步状态">
      <span class="dot"></span><span class="sync-text">未连接</span>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- 侧边目录 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 / 0 节</span>
    </div>
  </div>
  <nav class="toc" id="toc"><div class="loading">加载目录…</div></nav>
</aside>
<div class="scrim" id="scrim"></div>

<!-- 正文 -->
<main class="main" id="main">
  <article class="lesson" id="lesson">
    <div class="loading">加载课程内容…</div>
  </article>
  <nav class="lesson-nav" id="lesson-nav"></nav>
</main>

<!-- 笔记面板 -->
<section class="notes" id="notes">
  <div class="notes-head">
    <span class="notes-title">📝 本节笔记</span>
    <div class="notes-actions">
      <button class="mini-btn" id="btn-note-preview" title="预览">预览</button>
      <button class="mini-btn" id="btn-note-edit" title="编辑">编辑</button>
      <button class="mini-btn danger" id="btn-note-clear" title="清空本节笔记">清空</button>
    </div>
  </div>
  <textarea class="note-input" id="note-input" placeholder="读完写下你的理解、踩过的坑、想改写的代码…&#10;&#10;支持 Markdown。自动保存到你的私有仓库，换设备也能接着看。"></textarea>
  <div class="note-preview markdown" id="note-preview" hidden></div>
  <div class="notes-foot">
    <span id="note-status">未保存</span>
    <button class="mini-btn" id="btn-note-sync">立即同步</button>
  </div>
</section>

<button class="note-fab" id="note-fab" aria-label="打开笔记">📝</button>

<!-- 设置 / 授权弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">连接 GitHub 以同步笔记</h2>
      <button class="icon-btn" id="btn-modal-close">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- Pyodide 内核（懒加载，仅在首次运行代码时拉取） -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<!-- marked：Markdown 渲染，本地渲染器 fallback -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<script src="./js/storage.js"></script>
<script src="./js/markdown.js"></script>
<script src="./js/github-api.js"></script>
<script src="./js/config-sync.js"></script>
<script src="./js/godbolt.js"></script>
<script src="./js/runner.js"></script>
<script src="./js/codeblock.js"></script>
<script src="./js/quiz.js"></script>
<script src="./js/review.js"></script>
<script src="./js/guardian.js"></script>
<script src="./js/notes.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
